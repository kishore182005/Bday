      <stop offset="0%" stop-color="#190e24" />
      <stop offset="50%" stop-color="#36173d" />
      <stop offset="100%" stop-color="#0f0714" />
    </linearGradient>
    <radialGradient id="morningLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#190e24" stop-opacity="0" />
