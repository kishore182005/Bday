  <text x="400" y="520" text-anchor="middle" fill="#fed7aa" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="2">Quiet Sunday Mornings</text>
  <text x="400" y="550" text-anchor="middle" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" opacity="0.8" letter-spacing="3">OUR SAFE SANCTUARY</text>
