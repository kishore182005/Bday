  <path d="M0,450 Q200,430 400,440 T800,430 L800,600 L0,600 Z" fill="#0c071a" />
  <text x="400" y="520" text-anchor="middle" fill="#e9d5ff" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="2">Midnight Rooftop Stargazing</text>
  <text x="400" y="550" text-anchor="middle" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" opacity="0.8" letter-spacing="3">UNDER THE CELESTIAL CANOPY</text>
