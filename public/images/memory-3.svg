<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140618" />
      <stop offset="50%" stop-color="#2d0b28" />
      <stop offset="100%" stop-color="#0c020f" />
    </linearGradient>
    <radialGradient id="coffeeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#140618" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)" />
  <circle cx="400" cy="270" r="180" fill="url(#coffeeGlow)" />
  <!-- Cafe window & coffee steam heart -->
  <g transform="translate(360, 210) scale(1.2)" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round">
    <path d="M10,40 C10,15 40,15 40,40 C40,65 10,75 10,75 C10,75 -20,65 -20,40 C-20,15 10,15 10,40 Z" fill="#f43f5e" opacity="0.3" />
    <path d="M0,15 Q5,5 0,-5 T0,-25" opacity="0.7" />
    <path d="M20,15 Q25,5 20,-5 T20,-25" opacity="0.7" />
  </g>
  <path d="M0,450 L800,450 L800,600 L0,600 Z" fill="#0d0411" />
  <text x="400" y="520" text-anchor="middle" fill="#fbcfe8" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="2">The Rainy Day Cozy Cafe</text>
  <text x="400" y="550" text-anchor="middle" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" opacity="0.8" letter-spacing="3">WARM COFFEE &amp; SWEET SMILES</text>
</svg>
