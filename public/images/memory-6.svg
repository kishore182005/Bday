  <text x="400" y="520" text-anchor="middle" fill="#ffe4e6" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="2">A Celebration of You</text>
  <text x="400" y="550" text-anchor="middle" fill="#fb7185" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" opacity="0.8" letter-spacing="3">HAPPY BIRTHDAY, MY SUNSHINE</text>
