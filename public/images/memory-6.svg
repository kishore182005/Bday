      <stop offset="0%" stop-color="#2a081a" />
      <stop offset="50%" stop-color="#4c0527" />
      <stop offset="100%" stop-color="#14020a" />
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2a081a" stop-opacity="0" />
