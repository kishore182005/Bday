<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b24" />
      <stop offset="50%" stop-color="#3b1236" />
      <stop offset="100%" stop-color="#120417" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b1236" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)" />
  <circle cx="400" cy="300" r="220" fill="url(#sun)" />
  <!-- Stars -->
  <circle cx="150" cy="120" r="2" fill="#fff" opacity="0.8" />
  <circle cx="280" cy="90" r="1.5" fill="#fbcfe8" opacity="0.9" />
  <circle cx="650" cy="140" r="2.5" fill="#fff" opacity="0.7" />
  <circle cx="700" cy="240" r="1.5" fill="#fda4af" opacity="0.8" />
  <circle cx="100" cy="380" r="2" fill="#fff" opacity="0.6" />
  <!-- Silhouette Sunset Coast -->
  <path d="M0,480 Q200,420 400,460 T800,450 L800,600 L0,600 Z" fill="#09020d" opacity="0.9" />
  <!-- Two silhouette figures holding hands -->
  <g transform="translate(370, 360) scale(0.65)" fill="#fb7185">
    <!-- Heart above -->
    <path d="M50,15 C45,0 20,0 20,20 C20,35 50,55 50,55 C50,55 80,35 80,20 C80,0 55,0 50,15 Z" fill="#f43f5e" filter="url(#glow)" />
  </g>
  <text x="400" y="520" text-anchor="middle" fill="#fecdd3" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="2">Golden Sunset Memories</text>
  <text x="400" y="550" text-anchor="middle" fill="#fda4af" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" opacity="0.8" letter-spacing="3">OUR SPECIAL MOMENT</text>
</svg>
